      tweets.push({
        id: counter+1,
        catIndex: c,
        text: sentences[c][r],
        profile: profiles[counter % profiles.length],
        time: timeLabels[(counter*7) % timeLabels.length],
        replies: Math.floor(seededRandom(counter*3+1)*80)+1,
        retweets: Math.floor(seededRandom(counter*5+2)*300)+2,
        likes: Math.floor(seededRandom(counter*11+3)*1800)+15
      });
      counter++;
    }
  }

  let currentIndex = 0;
  let revealed = false;
  let themeIndex = 0;
  const themeNames = ["☀️ Light","🌙 Dim","⚫ Dark"];
  const themeClasses = ["","theme-dim","theme-dark"];

  const els = {
    avatar: document.getElementById("avatar"),
    displayName: document.getElementById("displayName"),
    handle: document.getElementById("handle"),
    timeAgo: document.getElementById("timeAgo"),
    tweetText: document.getElementById("tweetText"),
    statReplies: document.getElementById("statReplies"),
    statRetweets: document.getElementById("statRetweets"),
    statLikes: document.getElementById("statLikes"),
    revealPanel: document.getElementById("revealPanel"),
    revealTense: document.getElementById("revealTense"),
    revealExplanation: document.getElementById("revealExplanation"),
    revealFormation: document.getElementById("revealFormation"),
    counterLabel: document.getElementById("counterLabel"),
    categoryHintLabel: document.getElementById("categoryHintLabel"),
    progressFill: document.getElementById("progressFill"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    revealBtn: document.getElementById("revealBtn"),
    jumpInput: document.getElementById("jumpInput"),
    jumpBtn: document.getElementById("jumpBtn"),
    shuffleBtn: document.getElementById("shuffleBtn"),
    restartBtn: document.getElementById("restartBtn"),
    themeBtn: document.getElementById("themeBtn"),
    helperBanner: document.getElementById("helperBanner"),
    closeHelper: document.getElementById("closeHelper")
  };

  function formatNumber(n){
    if(n >= 1000) return (n/1000).toFixed(1).replace(".0","") + "K";
    return String(n);
  }

  function linkify(text){
    return text.replace(/#(\w+)/g, '<span class="tag">#$1</span>');
  }

  function render(){
    const t = tweets[currentIndex];
    els.avatar.style.background = t.profile.color;
    els.avatar.textContent = t.profile.initials;
    els.displayName.textContent = t.profile.name;
    els.handle.textContent = t.profile.handle;
    els.timeAgo.textContent = t.time;
    els.tweetText.innerHTML = linkify(t.text);
    els.statReplies.textContent = formatNumber(t.replies);
    els.statRetweets.textContent = formatNumber(t.retweets);
    els.statLikes.textContent = formatNumber(t.likes);

    const cat = categories[t.catIndex];
    els.revealTense.textContent = cat.tense;
    els.revealExplanation.textContent = cat.explanation;
    els.revealFormation.textContent = cat.formation;

    els.counterLabel.textContent = `Tweet ${currentIndex+1} / ${tweets.length}`;
    els.progressFill.style.width = (((currentIndex+1)/tweets.length)*100) + "%";
    els.jumpInput.value = currentIndex+1;

    els.prevBtn.disabled = currentIndex === 0;
    els.nextBtn.disabled = currentIndex === tweets.length-1;

    setRevealed(false);
  }

  function setRevealed(state){
    revealed = state;
    if(revealed){
      els.revealPanel.classList.add("show");
      els.revealBtn.textContent = "Hide answer";
      els.revealBtn.classList.add("active");
    } else {
      els.revealPanel.classList.remove("show");
      els.revealBtn.textContent = "Reveal answer";
      els.revealBtn.classList.remove("active");
    }
  }

  function goTo(index){
    if(index < 0 || index >= tweets.length) return;
    currentIndex = index;
    render();
  }

  function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  els.prevBtn.addEventListener("click", ()=>goTo(currentIndex-1));
  els.nextBtn.addEventListener("click", ()=>goTo(currentIndex+1));
  els.revealBtn.addEventListener("click", ()=>setRevealed(!revealed));

  els.jumpBtn.addEventListener("click", ()=>{
    const n = parseInt(els.jumpInput.value,10);
    if(!isNaN(n)) goTo(n-1);
  });
  els.jumpInput.addEventListener("keydown",(e)=>{
    if(e.key === "Enter") els.jumpBtn.click();
  });

  els.shuffleBtn.addEventListener("click", ()=>{
    shuffleArray(tweets);
    currentIndex = 0;
    render();
  });

  els.restartBtn.addEventListener("click", ()=>goTo(0));

  els.themeBtn.addEventListener("click", ()=>{
    themeIndex = (themeIndex+1) % 3;
    document.body.className = themeClasses[themeIndex];
    els.themeBtn.textContent = themeNames[themeIndex];
  });

  els.closeHelper.addEventListener("click", ()=>{
    els.helperBanner.style.display = "none";
  });

  document.addEventListener("keydown",(e)=>{
    if(document.activeElement === els.jumpInput) return;
    if(e.key === "ArrowRight") goTo(currentIndex+1);
    else if(e.key === "ArrowLeft") goTo(currentIndex-1);
    else if(e.key === " " || e.key === "Enter"){
      e.preventDefault();
      els.revealBtn.click();
    }
  });

  render();
})();
</script>

</body></html>
