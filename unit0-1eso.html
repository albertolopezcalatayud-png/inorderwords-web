<style>
:root{
  --ink:#1F2024; --paper:#FFFDF6; --hi:#FFE24A; --blu:#3D82E8; --pnk:#F2568C;
  --grn:#2FA45B; --red:#E0392F; --pur:#8A5CE8; --org:#F08A24; --mut:#8A8794;
  --teamA:#F2568C; --teamB:#3D82E8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Patrick Hand",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(rgba(31,32,36,.05) 1.2px,transparent 1.3px) 0 0/22px 22px, var(--paper)}
.mk{font-family:"Shantell Sans",system-ui,sans-serif;font-weight:800}
.cv{font-family:"Caveat",cursive;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid var(--ink);background:#fff}
.badge{font-family:"Shantell Sans";font-weight:800;font-size:15px;background:var(--ink);color:#FFE24A;border-radius:10px;padding:3px 12px}
.utitle{font-family:"Shantell Sans";font-weight:800;font-size:17px;line-height:1}
.usub{font-family:"Caveat";font-weight:700;font-size:17px;color:var(--mut);line-height:1}
select.sess{font-family:"Shantell Sans";font-weight:700;font-size:14px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff}
.spacer{flex:1}
.voicebox{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:14px;padding:3px 8px;background:#fff}
.vlabel{font-family:"Shantell Sans";font-weight:800;font-size:11px;letter-spacing:.04em}
.script{background:#FFF6C9;border:3px dashed var(--ink);border-radius:14px;padding:12px 16px;
  font-size:clamp(16px,1.85vw,25px);text-align:left;line-height:1.35}
.script b.role{font-family:"Shantell Sans";font-weight:800;color:var(--pnk)}
.script b.role2{font-family:"Shantell Sans";font-weight:800;color:var(--blu)}

/* session objective + student's book page chips */
.chip{display:flex;align-items:center;gap:4px;border:3px solid var(--ink);border-radius:14px;padding:3px 8px;background:#fff;flex:0 0 auto}
.chip .chiplabel{font-size:12px;line-height:1;flex:0 0 auto}
.chip .chipval{font-family:"Shantell Sans";font-weight:700;font-size:11px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.chip.obj{background:#FFF3D6}
.chip.obj .chipval{width:110px}
.chip.pg{background:var(--hi)}
.chip.pg .chipval{width:52px;font-family:"Caveat";font-weight:700;font-size:14px}
.chip.pg.hide{display:none}

/* stage */
main{flex:1;min-height:0;padding:18px 26px;display:flex;flex-direction:column}
.slide{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stag{display:flex;align-items:center;gap:12px}
.pill{font-family:"Shantell Sans";font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  border:3px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--hi);transform:rotate(-1.5deg)}
.cooppill{font-family:"Shantell Sans";font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  border:3px solid var(--ink);border-radius:999px;padding:3px 14px;background:#FFE24A;color:#1F2024;
  transform:rotate(1.2deg);box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
h1.t{font-family:"Shantell Sans";font-weight:800;font-size:clamp(26px,3.4vw,46px);line-height:1.05;margin:0}
.sub{font-family:"Caveat";font-weight:700;font-size:clamp(18px,2vw,26px);color:var(--mut);margin:0}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:auto}

/* generic card */
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px 20px;box-shadow:6px 6px 0 rgba(31,32,36,.13)}

/* ---- 1. PREDICT & FLIP vocabulary ---- */
.flipgrid{display:grid;gap:14px}
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;box-shadow:5px 5px 0 rgba(31,32,36,.14)}
.face.f{background:var(--hi)}
.face.b{background:#fff;transform:rotateY(180deg)}
.face .em{font-size:clamp(28px,4vw,52px);line-height:1}
.face .w{font-family:"Shantell Sans";font-weight:800;font-size:clamp(15px,1.7vw,25px);line-height:1.1}
.face .d{font-family:"Patrick Hand";font-size:clamp(12px,1.25vw,18px);color:#555;line-height:1.15;margin-top:3px}
.face .q{font-family:"Shantell Sans";font-weight:800;font-size:clamp(26px,3.5vw,50px);color:var(--ink);opacity:.5}

/* ---- 2. TEAM QUIZ ---- */
.qbox{text-align:center}
.qtext{font-family:"Shantell Sans";font-weight:800;font-size:clamp(22px,2.9vw,40px);line-height:1.15;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}

.opt .k{flex:0 0 auto;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;

.tbtn{border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-family:"Shantell Sans";font-weight:800;font-size:15px;background:#fff}

.sortwrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}

.bin h3{font-family:"Shantell Sans";font-weight:800;font-size:clamp(17px,2vw,26px);margin:0 0 2px;text-align:center}
.bin.over{background:#FFF7C9}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px}
.tok{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:7px 15px;font-family:"Shantell Sans";font-weight:700;
  font-size:clamp(15px,1.7vw,23px);box-shadow:4px 4px 0 rgba(31,32,36,.14);cursor:grab;user-select:none}
.tok.drag{opacity:.4}
.tok.good{background:#D9F7E4;box-shadow:4px 4px 0 var(--grn)}
.tok.bad{background:#FFE2E0;box-shadow:4px 4px 0 var(--red);animation:shake .4s}

/* ---- 4. SENTENCE BUILDER ---- */
.build{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;border:4px dashed var(--ink);
  border-radius:20px;padding:12px;align-items:center;background:#fff}
.build:empty::after{content:"tap the words in order →";font-family:"Caveat";font-weight:700;font-size:22px;color:var(--mut)}

/* ---- 5. CHALLENGE / countdown ---- */
.bigtimer{font-family:"Shantell Sans";font-weight:800;font-size:clamp(60px,11vw,150px);line-height:1;text-align:center}
.bar{height:20px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:var(--grn);width:100%;transition:width 1s linear}

/* ---- 6. WHEEL ---- */
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#wheel{border:5px solid var(--ink);border-radius:50%;box-shadow:8px 8px 0 rgba(31,32,36,.15);transition:transform 3.4s cubic-bezier(.15,.9,.2,1)}
.needle{font-size:34px;line-height:.6;margin-bottom:-6px}
.winner{font-family:"Shantell Sans";font-weight:800;font-size:clamp(22px,3vw,40px);min-height:1.2em;text-align:center}

/* ---- 7. HIDDEN PICTURE ---- */
.hp{position:relative;display:grid;place-items:center;flex:1;min-height:0}
.hpimg{font-size:clamp(80px,17vw,220px);line-height:1}
.hpgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
.hpt{background:var(--pur);border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;

.rv.on{background:#D9F7E4;border-style:solid;color:#0E7A3E}
ul.hand{list-style:none;margin:0;padding:0 0 0 26px;display:flex;flex-direction:column;gap:8px;
  font-size:clamp(17px,2.05vw,28px)}
ul.hand li{position:relative}
ul.hand li::before{content:"➸";position:absolute;left:-26px}
.hl{background:linear-gradient(104deg,transparent 2%,var(--hi) 6% 94%,transparent 98%);padding:0 6px;border-radius:3px;font-weight:700}
.hlb{background:linear-gradient(100deg,transparent 2%,#BFDCFF 6% 94%,transparent 98%);padding:0 6px;border-radius:3px;font-weight:700}
.note{background:#FFF6C9;border:3px solid var(--ink);border-radius:6px 26px 8px 28px;padding:12px 18px;

.note.b{background:#E1EEFC;border-radius:26px 6px 28px 8px}
.note.g{background:#E4F5DA}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.big{font-family:"Shantell Sans";font-weight:800;font-size:clamp(20px,2.5vw,34px)}
.mid{font-size:clamp(17px,2vw,27px)}
.ctr{text-align:center}
.emoji{font-size:clamp(40px,6vw,90px);line-height:1}

/* footer */
footer{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 18px;border-top:3px solid var(--ink);background:#fff}
.nav{border:3px solid var(--ink);border-radius:14px;padding:7px 18px;font-family:"Shantell Sans";font-weight:800;font-size:14px;
  background:#fff;box-shadow:4px 4px 0 rgba(31,32,36,.16)}
.nav.main{background:var(--hi)}
.nav:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(31,32,36,.16)}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1;justify-content:center}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer}
.dot.on{background:var(--ink);width:24px;border-radius:8px}
.tmr{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:14px;padding:4px 10px;background:#fff}
.tmr .d{font-family:"Shantell Sans";font-weight:800;font-size:20px;min-width:62px;text-align:center}
.tmr button{border:2px solid var(--ink);border-radius:8px;padding:1px 7px;font-family:"Shantell Sans";font-weight:800;font-size:12px;background:#fff}
.hint{font-family:"Caveat";font-weight:700;font-size:16px;color:var(--mut)}

/* ---- 9. MEMORY MATCH ---- */
.matchgrid{display:grid;gap:10px;flex:1;min-height:0}
.mcard{perspective:900px;cursor:pointer}
.min{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;min-height:76px}
.mcard.on .min,.mcard.found .min{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:16px;

.mcard.found .mface.mb{background:#D9F7E4;border-color:var(--grn)}

.tfcard.ok{background:#D9F7E4;box-shadow:6px 6px 0 var(--grn)}
.tfcard.no{background:#FFE2E0;box-shadow:6px 6px 0 var(--red)}

.tfbtn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(31,32,36,.15)}
.tfbtn.tftrue{background:#D9F7E4}
.tfbtn.tffalse{background:#FFE2E0}

/* ---- 11. PUT IN ORDER ---- */
.ranklane{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;border:4px dashed var(--ink);
  border-radius:20px;padding:12px;align-items:center;background:#fff}
.ranklane:empty::after{content:"tap the steps in order →";font-family:"Caveat";font-weight:700;font-size:22px;color:var(--mut)}
.ranknum{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:12px;font-weight:800;margin-right:7px}

/* ---- 12. BINGO ---- */
.bingogrid{display:grid;gap:8px;flex:1;min-height:0}
.bcell{border:3px solid var(--ink);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:"Shantell Sans";font-weight:700;font-size:clamp(13px,1.5vw,19px);padding:6px;cursor:pointer;
  box-shadow:4px 4px 0 rgba(31,32,36,.13);position:relative;transition:transform .1s}
.bcell:hover{transform:translate(-1px,-1px)}
.bcell.on{background:#FFE2E0}
.bcell.on::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,3.6vw,54px);color:var(--red);font-family:"Shantell Sans"}

/* ---- 13. BRANCHING STORY ---- */
.storycard{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:22px 28px;
  box-shadow:6px 6px 0 rgba(31,32,36,.13);font-size:clamp(18px,2.15vw,28px);line-height:1.4}
.storychoices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.storybtn{border:3px solid var(--ink);border-radius:16px;padding:12px 22px;background:var(--hi);
  font-family:"Shantell Sans";font-weight:800;font-size:clamp(15px,1.8vw,22px);box-shadow:5px 5px 0 rgba(31,32,36,.14);transition:transform .12s}
.storybtn:hover{transform:translate(-2px,-2px)}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.conf{position:absolute;width:11px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
</style>

/* ============ SOUND (no external files) ============ */
function beep(kind){
  if(!sound) return;
  try{
    const C = new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==='good' ? [[660,0],[880,.09],[1320,.18]]
              : kind==='bad'  ? [[300,0],[200,.12]]
              : kind==='tick' ? [[900,0]]
              : kind==='end'  ? [[520,0],[400,.15],[300,.3],[220,.45]]
              : [[740,0]];
    seq.forEach(([f,t])=>{
      const o=C.createOscillator(), g=C.createGain();
      o.type = kind==='bad' ? 'square':'sine';
      o.frequency.value=f; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(0.0001,C.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.16,C.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+t+.20);
      o.start(C.currentTime+t); o.stop(C.currentTime+t+.22);
    });
  }catch(e){}
}
let VOICES=[], VOICE=null, VOICE_B=null;
function scoreVoice(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase();
  let k=0;
  if(!l.startsWith('en')) return -1;                 // English voices only
  if(/natural|neural|online/.test(n)) k+=60;          // Edge / Windows 11 "Natural"
  if(/google/.test(n))               k+=45;          // Chrome Google voices
  if(/siri|premium|enhanced|samantha|daniel|serena/.test(n)) k+=35; // macOS/iPad
  if(l.startsWith('en-gb'))          k+=20;
  if(l.startsWith('en-us'))          k+=10;
  if(/zira|david|hazel|george|espeak|compact/.test(n)) k-=25;  // the robotic ones
  return k;
}
function loadVoices(){
  VOICES=(speechSynthesis.getVoices()||[]).filter(v=>(v.lang||'').toLowerCase().startsWith('en'))
        .sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  const sel=document.getElementById('voiceSel'); if(!sel) return;
  sel.innerHTML='';
  VOICES.forEach((v,i)=>{ const o=document.createElement('option'); o.value=i;
    o.textContent=(scoreVoice(v)>=45?'★ ':'')+v.name.replace(/ - .*/,'').slice(0,30); sel.appendChild(o); });
  let saved=null; try{ saved=localStorage.getItem('vc'); }catch(e){}
  const k = saved!==null && VOICES[+saved] ? +saved : 0;
  sel.value=k; VOICE=VOICES[k]||null;
}
function setVoice(i){ VOICE=VOICES[i]||null; try{localStorage.setItem('vc',i);}catch(e){} }
function testVoice(){ say("Hello! Can you hear me clearly at the back of the class?",0.95); }
/* sentence-by-sentence with a small pause: far less robotic than one long block */
function say(text, rate){
  try{
    speechSynthesis.cancel();
    const clean=String(text).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
    const parts=clean.match(/[^.!?]+[.!?]?/g)||[clean];
    parts.forEach((chunk,i)=>{
      const u=new SpeechSynthesisUtterance(chunk.trim());
      u.lang=(VOICE&&VOICE.lang)||'en-GB';
      u.rate=(rate||0.92); u.pitch=1.02;
      if(VOICE) u.voice=VOICE;
      setTimeout(()=>speechSynthesis.speak(u), i*40);
    });
  }catch(e){}
}
/* pick a second, audibly different voice for two-speaker dialogues (opposite
   gender by name when possible), so each character keeps a consistent voice */
function pickVoiceB(){
  if(!VOICES || VOICES.length<2) return null;
  const male=/\b(daniel|david|george|fred|alex|arthur|oliver|ryan|guy|thomas|james|aaron|gordon)\b/i;
  const female=/\b(samantha|serena|zira|hazel|karen|victoria|susan|kate|fiona|moira|tessa|martha|catherine|amelie|emma|zoe|allison|ava|nicky)\b/i;
  const cur=VOICE;
  let cand=null;
  if(cur && male.test(cur.name)) cand=VOICES.find(v=>v!==cur && female.test(v.name));
  else if(cur && female.test(cur.name)) cand=VOICES.find(v=>v!==cur && male.test(v.name));
  if(!cand) cand=VOICES.find(v=>v!==cur);
  return cand||null;
}
/* play a multi-speaker dialogue (roles: [{who,line}, ...]) line by line,
   alternating voice per speaker (or pitch, if only one voice is installed) */
function sayDialogue(roles, rate){
  try{
    speechSynthesis.cancel();
    const speakerKey={}; let n=0;
    roles.forEach(r=>{ if(!(r.who in speakerKey)){ speakerKey[r.who]=(n===0?'A':'B'); n++; } });
    const multi = n>1;
    const vB = multi ? pickVoiceB() : null;
    const queue = roles.map(r=>({text:r.line, spk:speakerKey[r.who]}));
    let i=0;
    function next(){
      if(i>=queue.length) return;
      const item=queue[i++];
      const clean=String(item.text).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
      if(!clean){ next(); return; }
      const u=new SpeechSynthesisUtterance(clean);
      const useB = item.spk==='B';
      u.lang=((useB&&vB)?vB.lang:(VOICE&&VOICE.lang))||'en-GB';
      u.rate=(rate||0.92);
      u.pitch = useB ? (vB?1.02:0.78) : 1.02;
      if(useB && vB) u.voice=vB; else if(VOICE) u.voice=VOICE;
      u.onend=next; u.onerror=next;
      speechSynthesis.speak(u);
    }
    next();
  }catch(e){}
}
/* dialogue-aware audio button for quiz-type listening slides: uses the two-voice
   reader when the current slide has roles, otherwise falls back to the flat audio text */
function playSlideAudio(rate){

function detectCoop(d){
  const fields = [d.title, d.what, d.text, d.prompt, d.scaffold, d.why, Array.isArray(d.steps)?d.steps.join(' '):null];
  const re = new RegExp('(' + COOP_TECHNIQUES.map(t=>t.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&')).join('|') + ')', 'i');
  for (const f of fields){
    if (typeof f === 'string'){
      const m = f.match(re);
      if (m) return m[1];
    }
  }
  return null;
}

      paths+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-family="Shantell Sans" font-weight="800" font-size="34">${i+1}</text>`;
    });
    B.innerHTML=`<div style="display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;flex:1;min-height:0">
      <div class="wheelwrap">
        <div class="needle">🔻</div>
        <svg id="wheel" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>
        <button class="nav main" style="font-size:17px;padding:9px 26px" onclick="spin(${items.length})">🎯 SPIN!</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="note b">${d.prompt||'🎡 Spin the wheel. Whoever it lands on answers — in English!'}</div>
        <div class="card" id="winbox" style="min-height:96px;display:flex;align-items:center;justify-content:center">
          <div class="winner" id="win" style="color:var(--mut);font-size:clamp(19px,2.2vw,30px)">press <b>SPIN!</b> 🎯</div></div>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${items.map((it,i)=>`<span class="tok" style="font-size:14px;padding:3px 10px;box-shadow:none;cursor:default"><b>${i+1}.</b> ${esc(it)}</span>`).join('')}
        </div>
      </div></div>`;
    window._wheelItems=items; window._rot=0;
  },
  /* --- 7. HIDDEN PICTURE --- */
  hidden(B,d){
    B.innerHTML=`<div class="note ctr">${d.prompt||'🖼️ Every correct answer removes a tile. What is hiding behind?'}</div>
      <div class="hp"><div class="hpimg">${d.picture}</div><div class="hpgrid" id="hpg"></div></div>
      <div class="ctr big" id="hpq">${d.questions[0]}</div>
      <div class="ctr"><button class="nav main" onclick="hpNext()">✅ CORRECT → remove a tile</button>
        <button class="nav" onclick="document.getElementById('hpa').style.display='block'">👀 answer</button></div>
      <div class="ctr note g" id="hpa" style="display:none">${d.answers[0]}</div>`;
    const g=document.getElementById('hpg');
    for(let i=0;i<8;i++){ const t=document.createElement('div'); t.className='hpt'; t.textContent=i+1; g.appendChild(t); }
    window._hp={i:0,qs:d.questions,as:d.answers};
  },
  /* --- visual grammar --- */
  grammar(B,d){
    B.innerHTML=`${d.formula?`<div class="card ctr big">${d.formula}</div>`:''}
      <div class="cols${d.blocks.length===3?3:2}">
        ${d.blocks.map(b=>`<div class="card"><div class="big" style="color:${b.color||'var(--blu)'}">${b.h}</div>
          <ul class="hand">${b.li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}
      </div>
      ${d.warn?`<div class="note ctr" style="background:#FFE2E0">🚨 ${d.warn}</div>`:''}`;
  },
  /* --- gap fill --- */
  gaps(B,d){
    B.innerHTML=`<div class="note ctr">${d.prompt||'✍️ Everyone writes on their mini-whiteboard. 3… 2… 1… show me! Then we check.'}</div>
      <ul class="hand" style="font-size:clamp(19px,2.3vw,32px)">
        ${d.items.map(it=>`<li>${it.replace(/\{(.+?)\}/g,'<span class="rv" onclick="this.classList.toggle(\'on\');beep(\'good\')">$1</span>')}</li>`).join('')}
      </ul>
      <div class="ctr"><button class="nav main" onclick="document.querySelectorAll('.rv').forEach(r=>{r.classList.add('on')});beep('good')">👀 REVEAL ALL</button></div>`;
  },
  /* --- speaking / task --- */
  task(B,d){
    B.innerHTML=`<div class="cols2" style="align-items:start">
      <div class="card"><div class="big">🗣️ ${d.what}</div>
        ${d.scaffold?`<div class="note b" style="margin-top:10px">${d.scaffold}</div>`:''}</div>
      <div>${d.steps?`<div class="card"><ul class="hand">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ul></div>`:''}
        ${d.extra?`<div class="note g" style="margin-top:12px">🚀 ${d.extra}</div>`:''}</div></div>
      <div class="ctr"><button class="nav main" onclick="startTimer(${d.seconds||120})">⏱ ${Math.round((d.seconds||120)/60)} min · GO!</button></div>`;
  },
  /* --- 9. MEMORY MATCH --- */
  match(B,d){
    B.innerHTML=`<div class="note ctr">${d.prompt||'🧠 Find the matching pairs! Click two cards.'}</div>
      <div class="matchgrid" id="mgrid"></div>`;
    const cards=[];
    d.pairs.forEach((p,i)=>{ cards.push({pid:i,side:'a',val:p.a}); cards.push({pid:i,side:'b',val:p.b}); });
    cards.sort(()=>Math.random()-.5);
    const g=document.getElementById('mgrid');
    const cols = cards.length<=12?4:cards.length<=16?4:6;
    g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    let open=[], lock=false, found=0;
    cards.forEach((c,i)=>{
      const el=document.createElement('div'); el.className='mcard'; el.dataset.pid=c.pid;
      el.innerHTML=`<div class="min">
        <div class="mface mf"><span>?</span></div>
        <div class="mface mb">${c.val}</div></div>`;
      el.onclick=()=>{
        if(lock||el.classList.contains('on')||el.classList.contains('found')) return;
        el.classList.add('on'); open.push(el); beep('tick');
        if(open.length===2){
          lock=true;
          const same = open[0].dataset.pid===open[1].dataset.pid;
          setTimeout(()=>{
            if(same){ open.forEach(o=>{o.classList.add('found');}); found++; beep('good');
              if(found===d.pairs.length) confetti();
            } else { open.forEach(o=>o.classList.remove('on')); beep('bad'); }
            open=[]; lock=false;
          }, same?550:800);
        }
      };
      g.appendChild(el);
    });
  },
  /* --- 10. TRUE OR FALSE BLITZ --- */
  truefalse(B,d){
    B.innerHTML=`<div class="note b ctr">${d.prompt||'⚡ True or False? Decide fast!'}</div>
      <div class="tfcard ctr" id="tfcard"></div>
      <div class="ctr" style="display:flex;gap:16px;justify-content:center;margin-top:8px">
        <button class="tfbtn tftrue" id="tfTrue">✅ TRUE</button>
        <button class="tfbtn tffalse" id="tfFalse">❌ FALSE</button></div>
      <div class="ctr" style="margin-top:8px;font-family:'Shantell Sans';font-weight:800" id="tfStreak">streak: 0</div>`;
    let i=0, streak=0;
    const card=document.getElementById('tfcard');
    const streakEl=document.getElementById('tfStreak');
    function show(){
      if(i>=d.statements.length){
        card.innerHTML=`🎉 Done! Final streak: <b>${streak}</b>`;
        document.getElementById('tfTrue').style.visibility='hidden';
        document.getElementById('tfFalse').style.visibility='hidden';
        confetti(); return;
      }
      card.innerHTML=d.statements[i].s; card.className='tfcard ctr';
    }
    function answer(pick){
      const correct = d.statements[i].a===pick;
      card.classList.add(correct?'ok':'no');
      if(correct){ streak++; beep('good'); } else { streak=0; beep('bad'); }
      streakEl.textContent='streak: '+streak;
      i++;
      setTimeout(show,700);
    }
    document.getElementById('tfTrue').onclick=()=>answer(true);
    document.getElementById('tfFalse').onclick=()=>answer(false);
    show();
  },
  /* --- 11. PUT IN ORDER --- */
  rank(B,d){
    B.innerHTML=`<div class="note b ctr">${d.prompt||'🔢 Tap the steps IN THE CORRECT ORDER.'}</div>
      <div class="ranklane" id="rline"></div>
      <div class="pool" id="rpool"></div>
      <div class="fb ctr" id="rfb"></div>
      <div class="ctr"><button class="nav" onclick="render()">↺ TRY AGAIN</button></div>`;
    window._rankTarget = d.items;
    const pool=document.getElementById('rpool');
    d.items.slice().sort(()=>Math.random()-.5).forEach(w=>{
      const t=document.createElement('div'); t.className='tok'; t.textContent=w;
      t.onclick=()=>{
        const line=document.getElementById('rline');
        const pos=line.children.length;
        if(w===window._rankTarget[pos]){
          t.classList.add('good'); line.appendChild(t); beep('good');
          const slot=document.createElement('span'); slot.className='ranknum'; slot.textContent=pos+1;
          t.prepend(slot);
          if(line.children.length===window._rankTarget.length){
            document.getElementById('rfb').innerHTML='🎉 Perfect order! '+(d.why||'');
            confetti();
          }
        } else { t.classList.add('bad'); beep('bad'); setTimeout(()=>t.classList.remove('bad'),420);
          document.getElementById('rfb').innerHTML='🤔 Not next — think about what comes first.'; }
      };
      pool.appendChild(t);
    });
  },
  /* --- 12. BINGO --- */
  bingo(B,d){
    const n=d.cells.length, cols = n>=16?4:3;
    B.innerHTML=`<div class="note ctr">${d.prompt||'🎯 Cross off a word when you hear it. Shout BINGO on a full line!'}</div>
      <div class="bingogrid" id="bgrid" style="grid-template-columns:repeat(${cols},1fr)"></div>
      <div class="ctr"><button class="nav" id="clearBingoBtn">↺ CLEAR BOARD</button></div>`;
    const g=document.getElementById('bgrid');
    d.cells.forEach(w=>{
      const c=document.createElement('div'); c.className='bcell'; c.textContent=w;
      c.onclick=()=>{ c.classList.toggle('on'); beep(c.classList.contains('on')?'good':'tick'); };
      g.appendChild(c);
    });
    document.getElementById('clearBingoBtn').onclick=()=>g.querySelectorAll('.bcell').forEach(c=>c.classList.remove('on'));
  },
  /* --- 13. BRANCHING STORY --- */
  story(B,d){
    B.innerHTML=`<div class="storycard" id="storytext">${d.start}</div>
      <div class="storychoices" id="storychoices"></div>`;
    const box=document.getElementById('storychoices');
    const txt=document.getElementById('storytext');
    d.choices.forEach(ch=>{
      const b=document.createElement('button'); b.className='storybtn'; b.textContent=ch.label;
      b.onclick=()=>{ txt.innerHTML=ch.result; box.innerHTML=''; beep('good'); if(ch.win) confetti(); };
      box.appendChild(b);
    });
  }
};

/* button helpers */
function toggleScript(){ const b=document.getElementById('scriptBox'); if(b) b.style.display = b.style.display==='none'?'block':'none'; }
function flipAll(){ document.querySelectorAll('.flip').forEach((f,i)=>setTimeout(()=>{f.classList.add('on');},i*90)); beep('good'); confetti(); }
function resetBuild(){ render(); }
function spin(n){
  const w=document.getElementById('wheel');
  const pick=Math.floor(Math.random()*n);
  const seg=360/n;
  window._rot += 360*4 + (360 - (pick*seg + seg/2));
  w.style.transform=`rotate(${window._rot}deg)`;
  beep('tick');
  setTimeout(()=>{ const w2=document.getElementById('win');
    w2.style.color='var(--ink)'; w2.style.fontSize='clamp(24px,3.2vw,44px)';
    w2.innerHTML='🎯 '+window._wheelItems[pick];
    beep('good'); confetti(); say(window._wheelItems[pick],.9); },3450);
}
function hpNext(){
  const s=window._hp; const tiles=document.querySelectorAll('.hpt:not(.off)');
  if(tiles.length) tiles[Math.floor(Math.random()*tiles.length)].classList.add('off');
  beep('good');
  s.i++;
  if(s.i<s.qs.length){ document.getElementById('hpq').innerHTML=s.qs[s.i];
    const a=document.getElementById('hpa'); a.innerHTML=s.as[s.i]; a.style.display='none'; }
  else { document.getElementById('hpq').innerHTML='🎉 What is it? Say it in English!';
    document.querySelectorAll('.hpt').forEach(t=>t.classList.add('off')); confetti(); }
}

/* ============ NAV ============ */
function drawDots(){
  const D=document.getElementById('dots'); D.innerHTML='';
  DATA[sess].slides.forEach((_,i)=>{
    const b=document.createElement('button'); b.className='dot'+(i===idx?' on':'');
    b.onclick=()=>{idx=i;render();}; D.appendChild(b);
  });
}
function move(n){
  const L=DATA[sess].slides.length;
  if(idx+n<0){ if(sess>KEYS[0]){ sess--; idx=DATA[sess].slides.length-1; render(); } return; }
  if(idx+n>=L){ if(sess<KEYS[KEYS.length-1]){ sess++; idx=0; render(); } return; }
  idx+=n; render();
}
function goSession(v){ sess=v; idx=0; render(); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();move(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1);}
  if(e.key.toLowerCase()==='f') fs();
  if(e.key.toLowerCase()==='s'){ sound=!sound; }
});

/* init */
(function(){
  const sel=document.getElementById('sessSel');
  KEYS.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent='S'+k+' · '+DATA[k].title; sel.appendChild(o); });
  render();
  if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
})();
</script>
